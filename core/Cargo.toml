[package]
name = "goxviet-core"
version = "2.0.0"
edition = "2021"
authors = ["nihmtaho"]
license = "MIT"
description = "Gõ Việt - Vietnamese input method core engine"

[lib]
name = "goxviet_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Vietnamese dictionary O(1) lookup (phf = perfect hash function)
phf = { version = "0.11", features = ["macros"] }
# JSON serialization for InputMethodConfig FFI transfer
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Build-time generation of phf sets from dictionary files
phf_codegen = "0.11"

[dev-dependencies]
rstest = "0.18"
serial_test = "3.0"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = "z"          # Optimize for size
lto = true               # Link-time optimization
codegen-units = 1        # Better optimization
strip = false            # Keep symbols for debugging
panic = "abort"          # Smaller binary

[profile.dev]
opt-level = 0            # Fast compilation
debug = true             # Full debug info

[[bench]]
name = "backspace_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[[bench]]
name = "english_detection_bench"
harness = false

[[bench]]
name = "shortcut_bench"
harness = false

[[bench]]
name = "encoding_bench"
harness = false

[[bench]]
name = "clean_arch_bench"
harness = false

[[bench]]
name = "sprint_d_bench"
harness = false
