name: Windows CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'core/**'
      - 'platforms/windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'platforms/windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build Rust core as DLL for Windows x64
  # ──────────────────────────────────────────────
  build-rust-dll:
    name: Build Rust Core DLL (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (MSVC stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Verify cdylib in Cargo.toml
        run: |
          $content = Get-Content core/Cargo.toml -Raw
          if ($content -notmatch 'cdylib') {
            Write-Error "core/Cargo.toml must include 'cdylib' in crate-type for Windows DLL build."
            exit 1
          }
          Write-Host "cdylib target confirmed."

      - name: Build Rust core DLL (release)
        run: |
          cd core
          cargo build --release --target x86_64-pc-windows-msvc

      # Run unit tests (lib crate only — fast, no I/O)
      - name: Run unit tests
        run: |
          cd core
          cargo test --lib --release --target x86_64-pc-windows-msvc

      # Run integration tests, excluding slow eval suites (22k/100k word corpus)
      # and using single-threaded execution for tests marked #[serial]
      - name: Run integration tests
        env:
          RUST_LOG: error
          RUST_TEST_THREADS: 1
        run: |
          cd core
          cargo test --tests --release --target x86_64-pc-windows-msvc -- `
            --skip eval_vietnamese_22k `
            --skip eval_english_100k `
            --no-fail-fast

      - name: Verify DLL exports
        run: |
          $dll = "core/target/x86_64-pc-windows-msvc/release/goxviet_core.dll"
          $exports = & dumpbin /exports $dll 2>&1
          $required = @(
            "ime_create_engine_v2",
            "ime_process_key_v2",
            "ime_free_string_v2",
            "ime_destroy_engine_v2"
          )
          $missing = @()
          foreach ($sym in $required) {
            if ($exports -notmatch $sym) { $missing += $sym }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing DLL exports: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required exports present."

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: goxviet-core-dll
          path: core/target/x86_64-pc-windows-msvc/release/goxviet_core.dll
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 2: Build the C# Windows app
  # ──────────────────────────────────────────────
  build-dotnet:
    name: Build C# Windows App (.NET 8)
    runs-on: windows-latest
    needs: build-rust-dll
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Rust DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: goxviet-core-dll
          path: platforms/windows/src/GoxViet

      - name: Restore NuGet packages
        run: |
          cd platforms/windows
          dotnet restore GoxViet.sln

      - name: Build (Release x64)
        run: |
          cd platforms/windows
          dotnet build GoxViet.sln -c Release --no-restore -p:Platform=x64

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: goxviet-windows-app
          path: platforms/windows/src/GoxViet/bin/x64/Release/net8.0-windows/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 3: Package for release (on version tags only)
  # ──────────────────────────────────────────────
  release-windows:
    name: Package Windows Release
    runs-on: windows-latest
    needs: build-dotnet
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: goxviet-windows-app
          path: dist/windows

      - name: Extract version
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG"          >> $GITHUB_OUTPUT
          echo "version=${TAG#v}"  >> $GITHUB_OUTPUT

      - name: Create release ZIP
        run: |
          Compress-Archive -Path dist/windows/* `
            -DestinationPath "dist/GoxViet-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoxViet-${{ steps.version.outputs.version }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
