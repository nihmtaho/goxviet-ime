name: Windows CI

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*.*.*'
    paths:
      - 'core/**'
      - 'platforms/windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'core/**'
      - 'platforms/windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: write
  pull-requests: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build Rust core as DLL for Windows x64
  # ──────────────────────────────────────────────
  build-rust-dll:
    name: Build Rust Core DLL (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust (MSVC stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Verify cdylib in Cargo.toml
        run: |
          $content = Get-Content core/Cargo.toml -Raw
          if ($content -notmatch 'cdylib') {
            Write-Error "core/Cargo.toml must include 'cdylib' in crate-type for Windows DLL build."
            exit 1
          }
          Write-Host "cdylib target confirmed."

      - name: Build Rust core DLL (release)
        run: |
          cd core
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify DLL exports
        run: |
          $dll = "core/target/x86_64-pc-windows-msvc/release/goxviet_core.dll"

          # Locate dumpbin via vswhere (not in PATH by default on GitHub Actions)
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" `
                       -ErrorAction Stop | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using dumpbin: $dumpbin"

          $exports = & $dumpbin /exports $dll 2>&1
          $required = @(
            "ime_create_engine_v2",
            "ime_process_key_v2",
            "ime_free_string_v2",
            "ime_destroy_engine_v2"
          )
          $missing = @()
          foreach ($sym in $required) {
            if (-not ($exports -match $sym)) { $missing += $sym }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing DLL exports: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required exports present."

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v5
        with:
          name: goxviet-core-dll
          path: core/target/x86_64-pc-windows-msvc/release/goxviet_core.dll
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 2: Build the C# Windows app
  # ──────────────────────────────────────────────
  build-dotnet:
    name: Build C# Windows App (.NET 8)
    runs-on: windows-latest
    needs: build-rust-dll
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Rust DLL artifact
        uses: actions/download-artifact@v5
        with:
          name: goxviet-core-dll
          path: platforms/windows/src/GoxViet

      - name: Restore NuGet packages
        run: |
          cd platforms/windows
          dotnet restore GoxViet.sln

      - name: Build (Release x64)
        run: |
          cd platforms/windows
          dotnet build GoxViet.sln -c Release --no-restore -p:Platform=x64

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v5
        with:
          name: goxviet-windows-app
          path: platforms/windows/src/GoxViet/bin/x64/Release/net8.0-windows/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # Job 3: Pre-release
  # Chỉ chạy khi PR từ feature/* → develop có labels "windows" và "pre-release"
  # ──────────────────────────────────────────────────────────────────────
  pre-release-windows:
    name: Pre-release Windows Build
    runs-on: windows-latest
    needs: build-dotnet
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop' &&
      startsWith(github.event.pull_request.head.ref, 'feature/') &&
      contains(github.event.pull_request.labels.*.name, 'windows') &&
      contains(github.event.pull_request.labels.*.name, 'pre-release')
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Download app artifact
        uses: actions/download-artifact@v5
        with:
          name: goxviet-windows-app
          path: dist/windows

      - name: Generate pre-release version
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          PR_NUMBER=${{ github.event.pull_request.number }}
          VERSION="0.0.0-pre.pr${PR_NUMBER}.${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Pre-release version: $VERSION"

      - name: Create pre-release ZIP
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path dist/windows/* `
            -DestinationPath "dist/GoxViet-$version-windows-x64.zip"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ steps.version.outputs.version }}
          name: "[Pre-release] GoxViet Windows – PR #${{ github.event.pull_request.number }}"
          body: |
            **Pre-release build** từ PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            Branch: `${{ github.event.pull_request.head.ref }}` → `develop`
            Commit: `${{ github.sha }}`

            > Build tự động để test. Không dùng cho production.
          prerelease: true
          files: dist/GoxViet-${{ steps.version.outputs.version }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Job 4: Official release — chỉ chạy khi push tag v*.*.* (giống macOS)
  # ──────────────────────────────────────────────────────────────────────
  release-windows:
    name: Package Windows Release
    runs-on: windows-latest
    needs: build-dotnet
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Download app artifact
        uses: actions/download-artifact@v5
        with:
          name: goxviet-windows-app
          path: dist/windows

      - name: Extract version
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG"         >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Create release ZIP
        run: |
          Compress-Archive -Path dist/windows/* `
            -DestinationPath "dist/GoxViet-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoxViet-${{ steps.version.outputs.version }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
