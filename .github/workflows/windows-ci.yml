name: Windows CI

on:
  push:
    branches: [develop, main]
    tags:
      - 'v*.*.*'
    paths:
      - 'core/**'
      - 'platforms/windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'core/**'
      - 'platforms/windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: write
  pull-requests: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1: Build Rust core DLL — matrix: x64 + arm64
  # ─────────────────────────────────────────────────────────────────────
  build-rust-dll:
    name: Build Rust DLL (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust (MSVC stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.arch }}

      - name: Verify cdylib in Cargo.toml
        run: |
          $content = Get-Content core/Cargo.toml -Raw
          if ($content -notmatch 'cdylib') {
            Write-Error "core/Cargo.toml must include 'cdylib' in crate-type for Windows DLL build."
            exit 1
          }
          Write-Host "cdylib target confirmed."

      - name: Build Rust core DLL (${{ matrix.arch }})
        run: |
          cd core
          cargo build --release --target ${{ matrix.rust_target }}

      - name: Verify DLL exports
        run: |
          $dll = "core/target/${{ matrix.rust_target }}/release/goxviet_core.dll"

          # Locate dumpbin via vswhere (not in PATH by default on GitHub Actions)
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" `
                       -ErrorAction Stop | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using dumpbin: $dumpbin"

          $exports = & $dumpbin /exports $dll 2>&1
          $required = @(
            "ime_create_engine_v2",
            "ime_process_key_v2",
            "ime_free_string_v2",
            "ime_destroy_engine_v2"
          )
          $missing = @()
          foreach ($sym in $required) {
            if (-not ($exports -match $sym)) { $missing += $sym }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing DLL exports: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required exports present."

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v5
        with:
          name: goxviet-core-dll-${{ matrix.arch }}
          path: core/target/${{ matrix.rust_target }}/release/goxviet_core.dll
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: Build C# Windows app — matrix: x64 + arm64
  # ─────────────────────────────────────────────────────────────────────
  build-dotnet:
    name: Build C# App (${{ matrix.arch }})
    runs-on: windows-latest
    needs: build-rust-dll
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            dotnet_platform: x64
          - arch: arm64
            dotnet_platform: arm64

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Rust DLL artifact (${{ matrix.arch }})
        uses: actions/download-artifact@v5
        with:
          name: goxviet-core-dll-${{ matrix.arch }}
          path: platforms/windows/src/GoxViet

      - name: Restore NuGet packages
        run: |
          cd platforms/windows
          dotnet restore GoxViet.sln

      - name: Build (Release ${{ matrix.arch }})
        run: |
          cd platforms/windows
          dotnet build GoxViet.sln -c Release --no-restore `
            -p:Platform=${{ matrix.dotnet_platform }}

      - name: Upload Windows app artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v5
        with:
          name: goxviet-windows-app-${{ matrix.arch }}
          path: platforms/windows/src/GoxViet/bin/${{ matrix.dotnet_platform }}/Release/net8.0-windows/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 3: Pre-release
  # Chỉ chạy khi PR feature/* → develop có labels "windows" và "pre-release"
  # Đóng gói cả x64 và arm64, tạo tag và GitHub pre-release
  # ─────────────────────────────────────────────────────────────────────
  pre-release-windows:
    name: Pre-release Windows Build
    runs-on: windows-latest
    needs: build-dotnet
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop' &&
      startsWith(github.event.pull_request.head.ref, 'feature/') &&
      contains(github.event.pull_request.labels.*.name, 'windows') &&
      contains(github.event.pull_request.labels.*.name, 'pre-release')
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Download app artifact (x64)
        uses: actions/download-artifact@v5
        with:
          name: goxviet-windows-app-x64
          path: dist/windows-x64

      - name: Download app artifact (arm64)
        uses: actions/download-artifact@v5
        with:
          name: goxviet-windows-app-arm64
          path: dist/windows-arm64

      - name: Generate pre-release version
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          PR_NUMBER=${{ github.event.pull_request.number }}
          VERSION="0.0.0-pre.pr${PR_NUMBER}.${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Pre-release version: $VERSION"

      - name: Create pre-release ZIPs
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path dist/windows-x64/* `
            -DestinationPath "dist/GoxViet-$version-windows-x64.zip"
          Compress-Archive -Path dist/windows-arm64/* `
            -DestinationPath "dist/GoxViet-$version-windows-arm64.zip"

      - name: Create pre-release tag
        shell: bash
        run: |
          TAG="pre-${{ steps.version.outputs.version }}"
          echo "Creating tag: $TAG at ${{ github.sha }}"
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/${TAG}" \
            -f sha="${{ github.sha }}"
          echo "Tag created successfully."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ steps.version.outputs.version }}
          name: "[Pre-release] GoxViet Windows – PR #${{ github.event.pull_request.number }}"
          body: |
            **Pre-release build** từ PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}

            Branch: `${{ github.event.pull_request.head.ref }}` → `develop`
            Commit: `${{ github.sha }}`

            | Artifact | Architecture |
            |---|---|
            | `GoxViet-*-windows-x64.zip` | Windows x64 (Intel/AMD) |
            | `GoxViet-*-windows-arm64.zip` | Windows ARM64 (Snapdragon/Surface) |

            > Build tự động để test. Không dùng cho production.
          prerelease: true
          files: |
            dist/GoxViet-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/GoxViet-${{ steps.version.outputs.version }}-windows-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────
  # Job 4: Official release — chỉ chạy khi push tag v*.*.* (giống macOS)
  # Đóng gói cả x64 và arm64
  # ─────────────────────────────────────────────────────────────────────
  release-windows:
    name: Package Windows Release
    runs-on: windows-latest
    needs: build-dotnet
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Download app artifact (x64)
        uses: actions/download-artifact@v5
        with:
          name: goxviet-windows-app-x64
          path: dist/windows-x64

      - name: Download app artifact (arm64)
        uses: actions/download-artifact@v5
        with:
          name: goxviet-windows-app-arm64
          path: dist/windows-arm64

      - name: Extract version
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG"         >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Create release ZIPs
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path dist/windows-x64/* `
            -DestinationPath "dist/GoxViet-$version-windows-x64.zip"
          Compress-Archive -Path dist/windows-arm64/* `
            -DestinationPath "dist/GoxViet-$version-windows-arm64.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GoxViet-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/GoxViet-${{ steps.version.outputs.version }}-windows-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
